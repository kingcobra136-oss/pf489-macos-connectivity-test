name: PF489 single-run relay verification
on:
  push:
    paths:
      - .github/workflows/pf489_oneoff_relay_20261113.yml

permissions:
  contents: read
  id-token: write

jobs:
  relay_check:
    if: github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify authenticated read-only PF489 API once per city
        shell: bash
        env:
          RELAY_URL: https://pf489-vercel-connectivity-test.vercel.app/api/pf489-monitor-relay.mjs
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          u=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator="&" if "?" in u else "?"
          req=urllib.request.Request(
            u+separator+"audience=pf489-tennis-monitor-oidc-v1",
            headers={"Authorization":"bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(req,timeout=10) as response:
            token=json.load(response)["value"]
          passed=[]
          for city in ("kokubunji","kunitachi"):
            url=os.environ["RELAY_URL"]+"?city="+city
            request=urllib.request.Request(url,headers={"Authorization":"Bearer "+token})
            try:
              with urllib.request.urlopen(request,timeout=65) as response:
                status=response.status
                payload=json.load(response)
            except urllib.error.HTTPError as e:
              status=e.code
              try: payload=json.load(e)
              except Exception: payload={"error":"non-json http error"}
            except Exception as e:
              status=0
              payload={"error":str(e)[:160]}
            report=payload.get("report") or {}
            print("CITY_CHECK",json.dumps({
              "city":city,"http":status,"authenticated":payload.get("oidcVerified"),
              "stage":report.get("stage"),"days":report.get("calendarDays"),
              "slots":len(report.get("verifiedSlots") or []),
              "requestCount":payload.get("requestCount"),
              "error":payload.get("error"),
              "reason":report.get("reason")
            },ensure_ascii=False),flush=True)
            passed.append(status==200 and payload.get("oidcVerified") is True
                          and report.get("stage") in ("TIME_DETAIL_VERIFIED","FACILITY_SUMMARY_VERIFIED"))
          print("ONE_SHOT_SUMMARY",json.dumps({"ok":all(passed),"cities":passed}),flush=True)
          raise SystemExit(0 if all(passed) else 1)
          PY
