name: PF489 Kokubunji one-off check
on:
  push:
    paths:
      - .github/workflows/pf489_kokubunji_oneoff_20261113.yml

permissions:
  contents: read

concurrency:
  group: pf489-kokubunji-oneoff-20261113
  cancel-in-progress: false

jobs:
  kokubunji_oneoff:
    if: github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PF489_TEST_CITY: kokubunji
      PF489_TEST_ORIGIN: https://pf489-vercel-connectivity-test.vercel.app
    steps:
      - name: Checkout public test repo
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.53.0
          python -m playwright install --with-deps chromium
      - name: Test Kokubunji sports-only selection
        run: python pf489_relay_playwright_test.py
