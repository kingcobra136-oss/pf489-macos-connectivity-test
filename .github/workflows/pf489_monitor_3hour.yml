name: PF489 Tennis Monitor / prior twice-daily schedule (disabled)
# Restored from the original Kunitachi and Kokubunji GitHub configurations:
# Both cities: 08:07 and 20:07 JST (23:07 and 11:07 UTC).
# RULE GATE: Scheduled executions require explicit authorization.
# This schedule is documented here but is NOT activated.
# on:
#   schedule:
#     - cron: '7 11,23 * * *'
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Explicit authorization for this one test run'
        required: true
        default: 'DO_NOT_RUN'
        type: choice
        options:
          - DO_NOT_RUN
          - RUN_PF489_READ_ONLY_ONCE

permissions:
  contents: read
  id-token: write

concurrency:
  group: pf489-one-authorized-run
  cancel-in-progress: false

jobs:
  verify_readonly:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_PF489_READ_ONLY_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public scan client only
        uses: actions/checkout@v4
      - name: Verify Kokubunji calendar and Kunitachi summary (no LINE)
        run: python3 pf489_monitor_3hour_client_20261113.py
